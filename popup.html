<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h1>Tab<span>Closer</span></h1>
  </header>

  <div class="scroll">
    <section>
      <h2><span class="dot dot-green"></span> Current site</h2>
      <div id="current"></div>
    </section>

    <section>
      <h2><span class="dot dot-green"></span> Tracked sites <span id="activeCount" class="count"></span></h2>
      <div id="active"></div>
      <div id="activeMore" class="more"></div>
    </section>

    <section>
      <h2><span class="dot dot-amber"></span> Blocked <span id="blockCount" class="count"></span></h2>
      <div id="blocks"></div>
      <div id="blockMore" class="more"></div>
    </section>
  </div>

  <button id="openOptions">⚙ Open settings</button>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
