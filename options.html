<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TabCloser settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>TabCloser settings</h1>
    <p class="subtitle">
      Sites listed here close automatically after the chosen amount of <em>active</em>
      tab time. Optionally, the site stays blocked for a chosen duration after the close.
      To unblock early, use the button on each rule below.
    </p>

    <div id="rules"></div>

    <button id="addRule" class="primary">+ Add site</button>

    <p id="saveStatus" class="save-status"></p>
  </main>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
